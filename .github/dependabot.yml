version: 2

updates:
  # Pinned SHAs are only safe if something keeps them moving: a SHA that nobody
  # updates is a frozen action with whatever bugs it shipped with. Dependabot
  # opens the PR and rewrites both the SHA and the trailing `# v4` comment, which
  # is the only reason pinning by SHA is maintainable at all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Cargo is here and it is not in pact's config, because the two repositories
  # have different dependency stories. recount's budget is deliberately five
  # crates (serde, serde_json, clap, clap_complete, chrono, anyhow) plus tempfile
  # for tests, and docs/spec.md requires a justifying comment in Cargo.toml for
  # anything else. A small budget is exactly the situation where updates are
  # cheap to review and worth taking — the argument for skipping this ecosystem
  # only holds when you have none of it.
  #
  # The version requirements in Cargo.toml are caret ranges ("1", "4"), so most
  # of what arrives here is a Cargo.lock bump rather than a manifest change. That
  # still matters: every release builds `--locked`, so the lockfile IS what
  # ships, and an unattended lockfile is an unattended supply chain.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR for the routine bumps instead of six. Security updates are
    # deliberately NOT grouped: they should arrive alone, be reviewable alone,
    # and not sit behind an unrelated chrono bump that broke a test.
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
