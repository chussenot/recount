name: Release

# Two things happen here, in this order and only in this order: a tag is
# checked, then binaries are built and published from it. The `needs:` chain is
# what makes that an order rather than a hope.
#
# ## Why this is hand-written and not cargo-dist
#
# cargo-dist generates roughly a thousand lines of YAML this repository would
# then own without having written. recount's whole convention is explicit
# machinery with the reasoning attached — see `src/prune.rs` on why the window's
# upper bound cannot prune, or `src/connector/mod.rs` on why claiming precedes
# windowing. A release pipeline is a supply chain, and the one thing it must not
# be is opaque to its own maintainer.
#
# ## Dry runs
#
# `workflow_dispatch` with a `tag` input (default: the newest tag) builds and
# packages every matrix leg and publishes NOTHING. The alternative way to test a
# release pipeline is to cut a tag, and a tag is not a thing you get to take
# back. Publishing is skipped in that mode by the needs-chain rather than by a
# condition of its own; see the publish job's comment.
#
# ## What this repository does and does not promise
#
# `ci.yml` runs one job on one platform, because recount makes no MSRV promise
# and no cross-platform promise for BUILDING from source. Shipping a prebuilt
# binary is a narrower and different promise, made only for the three targets
# below, each built and smoke-tested on its own native runner. docs/install.md
# states both.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run — builds every leg, publishes nothing). Defaults to the newest tag."
        required: false
        type: string

# Read-only by default. `publish` widens this for itself and nothing else widens
# it at all: a build job that cannot write to the repository cannot leak a
# release even if a step in it is wrong.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is the one ref people trust without checking. This job checks it.
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Push-only, because every check below compares against `github.ref_name`,
    # which is a tag on a tag push and a BRANCH on a manual dispatch. Skipping it
    # is also what makes a dry run unable to publish, since `publish` needs it
    # and a skipped dependency skips its dependents.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry check needs real history and the master ref, neither of
          # which a shallow single-branch checkout provides.
          fetch-depth: 0

      - name: Tag commit is an ancestor of master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "$TAG ($GITHUB_SHA) is on master"
            exit 0
          fi
          cat >&2 <<EOF
          ::error::Tag $TAG points at $GITHUB_SHA, which is NOT an ancestor of origin/master.

          This is the orphaned-tag failure mode: a branch rebased or amended
          after a tag was cut leaves the tag on the pre-rebase commit, reachable
          from no branch at all. The tag still resolves and \`git show\` still
          works, so a release built from it can quietly differ from what master
          says shipped — or be garbage collected.

          Once you have confirmed the content really is on master
          (\`git diff $TAG origin/master\` should be empty):

              git tag -d $TAG
              git push origin :refs/tags/$TAG
              git tag -a $TAG <the-commit-on-master> -m "..."
              git push origin $TAG
          EOF
          exit 1

      - name: Cargo.toml version equals the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # First [package] version only: dependency versions also match
          # `^version` inside their own tables, so anchor on the file's first hit.
          out="$(grep -m1 -E '^version = "' Cargo.toml)"
          CARGO_VERSION="${out#version = \"}"
          CARGO_VERSION="${CARGO_VERSION%\"}"
          if [ "$CARGO_VERSION" != "$TAG" ]; then
            echo "::error::Cargo.toml says $CARGO_VERSION but the tag is $TAG. A tag that disagrees with the manifest ships a binary whose --version lies. Bump with \`cog bump\`, which moves the manifest, the lockfile and CHANGELOG.md together."
            exit 1
          fi
          echo "Cargo.toml: $CARGO_VERSION"

      - name: Cargo.lock agrees
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # recount's OWN entry, not a dependency that happens to share the
          # version: awk finds `name = "recount"` and reads the version from the
          # same [[package]] block.
          LOCK_VERSION="$(awk '
            /^name = "recount"$/ { found = 1; next }
            found && /^version = / { gsub(/^version = "|"$/, ""); print; exit }
          ' Cargo.lock)"
          if [ -z "$LOCK_VERSION" ]; then
            echo "::error::no [[package]] named recount in Cargo.lock — has the crate been renamed?"
            exit 1
          fi
          if [ "$LOCK_VERSION" != "$TAG" ]; then
            echo "::error::Cargo.lock has recount at $LOCK_VERSION but the tag is $TAG. The lockfile was not regenerated after the version bump, so a --locked build resolves the wrong version."
            exit 1
          fi
          echo "Cargo.lock: $LOCK_VERSION"

      # The notes are extracted at publish time, but an absent section should
      # fail within a minute of the tag rather than after every build leg has
      # run. The self-test proves the extractor still works before trusting it.
      - name: CHANGELOG.md has a section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/release-notes.sh --self-test
          if [ -z "$(./scripts/release-notes.sh "$TAG")" ]; then
            echo "::error::CHANGELOG.md has no section for $TAG. cog writes one on bump; a tag without one means the changelog was not committed with the version."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch tip — pins the ACTION, not the toolchain; Rust stays current because the action installs whatever stable is at run time

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Release build smoke check
        run: cargo build --release --locked

  # Resolve the tag once, so nothing downstream has to know which event started
  # the run.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git tag` needs the tags, which a shallow checkout does not fetch.
          fetch-depth: 0

      - name: Pick the tag
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # Newest by version, not by date: a re-created tag has a newer
            # timestamp and an older version.
            TAG="$(git tag --sort=-v:refname | head -n1)"
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::no such tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "building $TAG"

  build:
    needs: [integrity, resolve]
    # `integrity` is skipped on a dry run and MUST have succeeded otherwise. The
    # default `needs` semantics would skip this job along with it, so the result
    # is named explicitly — but only `success` and `skipped` are accepted, so an
    # integrity FAILURE still stops everything. A dry run may build; a broken tag
    # may not.
    if: ${{ !cancelled() && (needs.integrity.result == 'success' || needs.integrity.result == 'skipped') && needs.resolve.result == 'success' }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      # One broken target must not hide the state of the other two: "musl failed
      # but darwin was fine" is a diagnosis, and fail-fast erases it.
      fail-fast: false
      matrix:
        # Native runners only, no cross-rs: cross-compilation would add a tool to
        # trust for no coverage, and would cost the smoke run below, which only
        # works because every leg can execute the binary it just produced.
        #
        # No Windows, and the absence is a decision rather than an omission.
        # recount resolves `~/.claude/projects/<encoded-path>` where the encoding
        # is derived from POSIX absolute paths (docs/format-notes.md §1), shells
        # out to `git worktree list --porcelain` and compares the results as unix
        # paths, and every fixture in tests/ builds a POSIX tree. A Windows binary
        # would compile and then be wrong in ways no test here would catch.
        #
        # There is no feature axis, because recount has no cargo features: the
        # spec refuses a TUI, a daemon, network, embeddings and persistence, so
        # there is exactly one build and this matrix has one dimension.
        target:
          # musl means static: one binary that runs on any distro regardless of
          # glibc version, and inside `FROM scratch` images. This is the artifact
          # a CI fleet actually pulls, which is why it leads.
          - triple: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - triple: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          # Apple Silicon only. Intel macOS is absent because GitHub retired the
          # macos-13 image; an Intel leg would sit awaiting a runner and, since
          # `publish` needs every leg, would throw away every healthy build on
          # every tag. Intel Mac users build from source until a native runner
          # exists again — docs/install.md says so.
          - triple: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch tip — pins the ACTION, not the toolchain
        with:
          targets: ${{ matrix.target.triple }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # Without this every leg shares one cache key and they evict each
          # other, since the same crate is built three ways.
          key: ${{ matrix.target.triple }}

      # Nothing recount depends on needs a C compiler for musl today — the whole
      # dependency budget is serde, clap, clap_complete, chrono and anyhow, all
      # pure Rust. Installed anyway because the failure it prevents is a linker
      # error deep in a dependency, and it costs seconds.
      - name: Install musl toolchain
        if: matrix.target.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # --locked, so the artifact matches the lockfile `integrity` verified
      # against the tag. Resolving dependencies at build time would untie exactly
      # the knot that check ties.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target.triple }}

      # Before the verification step, not after, so what gets asserted is the
      # exact bytes that get packaged. That ordering is load-bearing on
      # aarch64-apple-darwin: the linker gives every arm64 macOS binary an ad-hoc
      # code signature, `strip` invalidates it, and an invalidated signature does
      # not warn — the kernel refuses to exec and the process dies with
      # `Killed: 9`. Verifying the pre-strip binary would ship that silently.
      - name: Strip
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target.triple }}/release/recount"
          before="$(wc -c <"$BIN")"
          strip "$BIN"
          # Re-sign ad hoc on macOS, for the reason above. `-` is the ad-hoc
          # identity the linker used; this needs no certificate and no
          # notarisation, it only makes the binary executable again.
          case "${{ matrix.target.triple }}" in
          *-apple-darwin) codesign --sign - --force "$BIN" ;;
          esac
          after="$(wc -c <"$BIN")"
          echo "stripped: $before -> $after bytes"

      # Run the binary that will actually be packaged, on the runner that just
      # produced it. recount has no features to assert, so the promise being
      # checked is simpler and more basic: it starts, it reports the right
      # version, its whole command surface is present, and the one command that
      # generates a file produces one.
      - name: Verify the packaged binary
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target.triple }}/release/recount"

          VERSION="$("$BIN" --version)"
          printf '%s\n' "$VERSION"
          grep -qF "$TAG" <<<"$VERSION" || {
            echo "::error::$BIN does not report $TAG"
            exit 1
          }

          # Every command the CLI reference documents, read out of --help rather
          # than hardcoded here: a hardcoded list is the same drift
          # scripts/check-docs.sh exists to prevent, one level down.
          for c in sessions at grep explain doctor completion; do
            "$BIN" --help | grep -qE "^[[:space:]]+$c[[:space:]]" || {
              echo "::error::the $c subcommand is missing from the release binary"
              exit 1
            }
          done

          # doctor is the command that must work when nothing else does, and it
          # exits 0 on every input by contract (docs/cli.md). Running it in an
          # empty directory is the cheapest real end-to-end check there is.
          ( cd "$(mktemp -d)" && "$OLDPWD/$BIN" doctor >/dev/null )
          echo "doctor exited 0 in an empty directory"

          # Non-empty output from the generator, so a release cannot ship a
          # completion command that produces nothing. Captured to a variable
          # rather than tested with `[ -s <(...) ]`: process substitution is a
          # fifo, and a fifo reports size 0 no matter what is written to it, so
          # that form would fail on a perfectly good binary.
          if [ "$("$BIN" completion bash | wc -c)" -lt 100 ]; then
            echo "::error::completion bash produced nothing usable"
            exit 1
          fi
          echo "command surface and completion generation both present"

      - name: Package
        id: package
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # `recount-<tag>-<triple>` is the shape every tool manager expects
          # (cf. ripgrep, bat).
          NAME="recount-$TAG-${{ matrix.target.triple }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target.triple }}/release/recount" "dist/$NAME/"
          cp README.md CHANGELOG.md "dist/$NAME/"
          # No LICENSE file in this repository yet. Copied when one appears
          # rather than failing the release the day it does.
          [ -f LICENSE ] && cp LICENSE "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          echo "name=$NAME" >>"$GITHUB_OUTPUT"
          ls -la "dist/$NAME.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error

  publish:
    # No `if:` at all, and that is deliberate. This job is gated purely by the
    # needs-chain, which cannot be got wrong by editing a condition: `integrity`
    # failing skips `build`, and either one not succeeding skips this. A dry run
    # skips `integrity`, so it skips this too — the dispatch mode gets its
    # publish-nothing behaviour from the same mechanism that stops a bad tag,
    # rather than from a second rule that could disagree with the first.
    needs: [integrity, build, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Widened here and nowhere else. `contents: write` creates the release; the
      # other two sign the provenance attestation below.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          # Three uploads, one directory. Without this each arrives in a
          # subdirectory named after its artifact.
          merge-multiple: true

      - name: Checksum every tarball
        run: |
          set -euo pipefail
          cd dist
          # A bare glob, which the shell expands in sorted order, so the file is
          # byte-identical for the same set of inputs and a human comparing two
          # releases sees only real differences. `--` because a filename could
          # otherwise be read as an option. Basenames only, so
          # `sha256sum -c SHA256SUMS` works wherever the files were downloaded.
          sha256sum -- *.tar.gz >SHA256SUMS
          cat SHA256SUMS
          # Prove the file we just wrote actually verifies, here, rather than
          # letting the first person to try it find out.
          sha256sum -c SHA256SUMS

      - name: Release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/release-notes.sh --self-test
          ./scripts/release-notes.sh "$TAG" >/tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $TAG."
            exit 1
          fi
          cat /tmp/notes.md

      # Cheap SLSA: consumers can run `gh attestation verify` on a tarball and
      # get back which workflow, which commit and which run produced it. It
      # composes with the SHA-pinning story — pinned actions say what ran, an
      # attestation says that it really did.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # `gh release create` rather than a third-party release action: it is
      # already on the runner and already authenticated, so it is one less
      # supply-chain edge for a step that literally publishes the supply chain.
      #
      # Neither a draft nor a prerelease: 0.x IS this project's release series,
      # and a draft that needs a human to press a button is a release that
      # sometimes does not happen.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --verify-tag \
            dist/*.tar.gz dist/SHA256SUMS
