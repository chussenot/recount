# One job, one platform. recount makes no cross-platform or MSRV promise
# (docs/spec.md: no network, no daemon, one connector family), so a matrix
# would be three times the minutes for a promise nobody made.
name: ci

on:
  push:
  pull_request:

# A PR on a branch of this repo would otherwise run push and pull_request twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Actions are pinned by SHA, not by tag: a tag is a moving pointer its
      # owner can repoint at any commit, which is the supply-chain hole that
      # `tj-actions/changed-files` fell through. The trailing comment is the
      # human-readable version, and .github/dependabot.yml is what keeps both
      # moving — a pin nobody updates is just an old action.
      #
      # Caches ~/.cargo (registry, git) and ./target, keyed on the lockfile and
      # toolchain. Must sit before the cargo steps: it restores where it stands
      # and saves in its post step.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # No toolchain action: the ubuntu-latest image ships stable Rust with
      # rustfmt and clippy already. Add dtolnay/rust-toolchain only to pin a
      # version, which would mean making the MSRV promise we don't make.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # A real gate, unlike the length check below: a doc that describes a
      # command the binary does not have sends a reader to a usage error while
      # they believe the tool is broken. Reads the command tree out of --help,
      # so it cannot go stale the way a hardcoded list would.
      - run: ./scripts/check-docs.sh

      # Warning, not a gate: an 850-line file is a conversation, not a build
      # break. The awk lives in scripts/check-lines.sh so that `mise run
      # lint-lines` and this job cannot drift apart — a local gate that does not
      # match CI is not a gate. The script explains what it counts and why.
      - name: File length (warning only)
        run: ./scripts/check-lines.sh github
