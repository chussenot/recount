# [wrappers.cargo] below, the mbx build cache's hook into Cargo, needs this mise.
min_version = "2026.8.16"

[tools]
rust = "latest"
# mr boxington (mbx): a shared build cache for Cargo. It restores matching
# compiler outputs from one store under ~/.cache/mbx and compiles the rest, so
# a second worktree, a fresh clone or a `cargo clean` starts warm instead of
# cold — and a pact fleet is many worktrees of one repository, every one of them
# compiling the same dependency graph. https://mr-boxington.jdx.dev
#
# Pinned, not `latest`: `[wrappers.cargo]` below routes every Cargo command
# through it, so a release that changes behaviour should arrive in a commit,
# not in a `mise install`. mise.cloud.toml carries the same version as a
# release URL; move the two together.
mr-boxington = "1.28.0"

# Every Cargo command mise runs — `mise run <task>`, `mise exec -- cargo …`, or
# plain `cargo` in a shell with mise activated — goes through mbx. This is what
# `mbx setup --local` writes. It is preferred to the rust tool's
# `mr_boxington = true` option because it does not depend on mise managing
# Rust: a cloud session's Rust is rustup's (mise.cloud.toml), and the option
# would silently stop wrapping there.
#
# THE ONE THING TO KNOW: after the first wrapped build, `target` is a symlink
# into mbx's store, and restored artifacts are read-only hard links. A Cargo
# that bypasses mbx (`~/.cargo/bin/cargo` with no mise activation, an IDE with
# its own PATH) cannot overwrite them and fails with "output file … is not
# writeable". Use `mise exec -- cargo …`, activate mise, or put mbx's Cargo
# shim first on PATH (`mbx setup`); docs/development.md has the details.
[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

# recount has NO cargo features, deliberately — docs/spec.md refuses a TUI, a
# daemon, network, embeddings and persistence, so there is nothing to gate. That
# is why there is no all-features/default-build pairing here: every task builds
# the one build that exists, and a two-way leg would be ceremony guarding
# nothing.

[tasks.build]
description = "Build the recount binary"
run = "cargo build"

[tasks.test]
description = "Run the whole suite: unit, degradation, fixture, keyed (benches are ignored here — see `bench`)"
# One leg, because there is one build. The benches live in tests/bench.rs behind
# #[ignore] and are NOT run here: they generate a ~193 MB synthetic corpus and
# take minutes, and they refuse to assert under debug_assertions anyway (a debug
# grep over that corpus is 35.9 s against a 2 s ceiling — a number about the
# profile, not the code).
run = "cargo test"

[tasks.bench]
description = "Measure the two ceilings docs/spec.md sets, and the keyed one (release, ~193 MB corpus, minutes)"
# Release is not optional and the task encodes it rather than trusting a human to
# remember: tests/bench.rs refuses to assert under debug_assertions, and the same
# grep measured 35.9 s in debug versus 2.83 s in release (tests/bench.rs).
#
# Deliberately NOT part of `check`: it writes a ~193 MB corpus into a tempdir and
# takes minutes. A required gate with those properties is one people disable.
# Run it when you have touched the connectors, prune, grep or the join.
run = "cargo test --release --test bench -- --ignored --nocapture"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks."fmt-check"]
description = "Check formatting without writing changes"
run = "cargo fmt -- --check"

[tasks.lint]
description = "Run clippy with warnings denied, over all targets"
# --all-targets, not the default: the default misses tests/, and every proof
# obligation in docs/spec.md lives there.
run = "cargo clippy --all-targets -- -D warnings"

[tasks."lint-lines"]
description = "Warn on files over the ~200-800 line house rule, counting code before tests"
# The same script the ci workflow calls, so the local gate cannot drift from the
# CI one.
run = "scripts/check-lines.sh"

[tasks."check-docs"]
description = "Fail if docs/cli.md drifts from the binary, or a relative link or anchor is dead"
# Needs a built binary: it reads the command tree out of `--help` rather than
# hardcoding it, because a hardcoded list is the same drift one level down.
run = ["cargo build", "scripts/check-docs.sh"]

[tasks.dogfood]
description = "Run recount against this repo's own coordination log — the check the test suite structurally cannot be"
# This exists because it has already paid for itself twice. The 26-agent build of
# recount had 111 green unit tests while `sessions --repo .` was reporting every
# transcript TWICE (once real, once as an empty generic_jsonl phantom), and while
# `--until` was presenting real 68-167-turn transcripts as empty. Both were
# invisible to every test and obvious in one command's output, because a fixture
# asserts what its author already believed.
#
# Not in `check`: it reads ~/.claude and its output is for a human to look at,
# not for a machine to pass. It prints and exits 0 even when it finds nothing.
run = [
  "cargo build",
  "./target/debug/recount doctor --repo .",
  "./target/debug/recount sessions --repo .",
  # The tool's first testimony is about its own birth: event 1 is this repo's
  # first pact context row, and it resolves to the session holding the prompt
  # that created recount. Exit 1 here is a REASONED refusal, not a failure —
  # see docs/limitations.md — so do not let it
  # stop the task.
  "./target/debug/recount explain --repo . --event-line 1 || true",
]

[tasks.check]
description = "Run the full CI check locally, serially, as CI does: fmt, lint, test, line length, docs"
# Sequential, and that is not a preference. `depends` runs tasks in PARALLEL, and
# these legs all reach the binary through the single path `target/debug/recount`.
# The integration tests spawn it via env!("CARGO_BIN_EXE_recount"), so a parallel
# leg rebuilding that file while another leg's tests are mid-spawn is a race with
# a confusing failure. pact's own mise.toml records losing three runs out of
# three to exactly this; there is no reason to rediscover it.
#
# Same order and same commands as .github/workflows/ci.yml. A local gate that
# does not match CI is not a gate.
run = [
  "mise run fmt-check",
  "mise run lint",
  "mise run test",
  "mise run lint-lines",
  "mise run check-docs",
]

[tasks.clean]
description = "Remove this checkout's build output, including its managed target in mbx; the shared cache stays"
# Both, because `cargo clean` alone is not a clean under mbx: `target` is a
# symlink into mbx's store, `cargo clean` removes the link, and the next build
# relinks the same managed target and finishes in a tenth of a second. `mbx
# clean` removes the managed target itself. The shared store — what makes the
# NEXT worktree warm — is untouched; `mbx gc` is how that shrinks.
run = ["cargo clean", "mbx clean"]

[tasks.cache]
description = "What the mbx build cache saved, and what it holds"
run = ["mbx stats", "mbx cache stats"]

[tasks.install]
description = "Build and install the recount binary onto PATH, and refresh shell completions"
# No feature flags to choose — recount has none.
run = [
  "cargo install --path . --force",
  """
  # Refresh the generated completion scripts. They come out of the same clap
  # command tree the parser uses, so they cannot name a command that does not
  # exist — but a shell caches the file, so an install otherwise leaves
  # yesterday's commands completing until someone regenerates it by hand, and
  # nobody does. Only directories that already exist are written, so this is a
  # no-op on a machine without them.
  refresh() { [ -d "$1" ] && recount completion "$2" > "$1/$3" && echo "completions: $1/$3"; true; }
  command -v recount >/dev/null || exit 0
  refresh "${ZDOTDIR:-$HOME}/.zsh/completions" zsh _recount
  refresh "$HOME/.local/share/bash-completion/completions" bash recount
  refresh "$HOME/.config/fish/completions" fish recount.fish
  """,
]
